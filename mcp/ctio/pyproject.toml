[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctio-mcp"
version = "0.1.0"
description = "Local MCP server for Beverley Fleet: read Colorado CTIO express-lane civil-penalty data (expresslanesafety.com/CO)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "playwright>=1.50",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ctio-mcp = "ctio_mcp.server:main"

[tool.setuptools]
packages = ["ctio_mcp"]

[tool.setuptools.package-data]
ctio_mcp = ["fleet.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real expresslanesafety.com site (set CTIO_LIVE=1)"]
